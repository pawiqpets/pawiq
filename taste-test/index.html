<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#5EC6FF">
<title>pawIQ Taste Test</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:Thunder;src:url(assets/thunder-bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Caveat;src:url(assets/caveat.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Satoshi;src:url(assets/satoshi-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Satoshi;src:url(assets/satoshi-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Satoshi;src:url(assets/satoshi-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--ink:#00080B;--paper:#F6F6F1;--blue:#5EC6FF;--green:#4FD6A5;--grey:#3D4245;--line:#C9CCCF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Satoshi,"Open Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper)}
a{color:var(--ink)}
.top{padding:20px 24px 26px;display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;min-height:28px}
.logo{height:24px;width:auto;display:block}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:0}
h1,h2,.display{font-family:Thunder,Satoshi,sans-serif;font-weight:700;text-transform:uppercase;line-height:.86;margin:0}
h1{font-size:64px}
h1.xl{font-size:76px}
h2{font-size:38px;line-height:.9}
h3{font-size:18px;font-weight:700;margin:0}
p{margin:0;line-height:1.5}
.lead{font-size:18px;font-weight:500}
.sec{padding:24px 24px 0;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:inherit;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt{min-height:52px;border:2px solid var(--ink);border-radius:14px;background:#fff;font-size:16px;font-weight:700;padding:0 16px}
.opt.left{text-align:left}
.opt.pill{border-radius:999px;min-height:48px;font-size:15px}
.opt[aria-pressed=true]{background:var(--ink);color:#fff}
.tl{display:block;font-family:Satoshi,sans-serif;font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;line-height:1;margin-top:6px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;height:170px;border:2px solid var(--ink);border-radius:20px;background:#fff;font-family:Thunder,Satoshi,sans-serif;font-weight:700;font-size:104px;line-height:.95;padding:0}
.tile[aria-pressed=true]{background:var(--ink);color:#fff}
.dash{border-style:dashed;background:transparent}
.cta{display:flex;justify-content:center;align-items:center;min-height:60px;border-radius:999px;background:var(--ink);color:#fff;font-size:17px;font-weight:700;text-decoration:none;border:0;width:100%}
.cta[disabled]{opacity:.35;cursor:not-allowed}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.link{background:none;border:0;font-size:14px;font-weight:700;text-decoration:underline;min-height:44px;padding:0 4px}
.back{background:none;border:0;font-size:15px;font-weight:700;padding:0;min-height:44px}
label.f{font-size:16px;font-weight:700;display:flex;flex-direction:column;gap:8px}
input[type=text],input[type=tel],input[type=email],input[type=number],textarea,select{font-family:inherit;font-size:17px;color:var(--ink);border:2px solid var(--ink);border-radius:14px;background:#fff;padding:14px 16px;width:100%}
select{appearance:auto;height:52px}
textarea{resize:vertical;min-height:96px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.tick{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45;font-weight:500;border:2px solid var(--ink);border-radius:14px;background:#fff;padding:14px 16px}
.tick input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--ink)}
.foot{margin-top:auto;padding:28px 24px 32px;display:flex;flex-direction:column;gap:8px}
.err{background:#FFE1E1;border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:700}
.muted{color:var(--grey);font-size:14px}
.step{display:flex;gap:16px;align-items:flex-start;border-top:2px solid var(--ink);padding-top:14px}
.step .n{font-family:Thunder,Satoshi,sans-serif;font-size:56px;line-height:.8;min-width:44px}
.card{border:2px solid var(--ink);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.dot.now{border-width:4px}
.keybox{font-size:14px;font-weight:700;word-break:break-all;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:12px 14px}
.sw{display:flex;align-items:center;gap:12px}
.sw .chip{flex:1;border:2px solid var(--ink);border-radius:14px;padding:14px;font-weight:700;font-size:14px}
.demo{background:var(--ink);color:#fff;font-size:12px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:0;z-index:5}
.demo a{color:#fff;font-weight:700;background:#ffffff22;border-radius:999px;padding:4px 10px;text-decoration:none}
table{border-collapse:collapse;width:100%}
td{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.spin{padding:80px 24px;text-align:center;font-weight:700}
.dogchip{align-self:flex-start;background:var(--ink);color:#fff;border-radius:999px;padding:6px 16px;font-size:17px;margin-top:4px}
.sh{display:inline-block;transform:rotate(-2.5deg);font-family:Caveat,"Segoe Print","Bradley Hand",cursive;font-weight:600;font-size:30px;line-height:1.1;margin:0;color:var(--ink);white-space:nowrap}
.doodle{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
.doodle text{font-family:Caveat,"Segoe Print","Bradley Hand",cursive;font-weight:600;fill:var(--ink)}
.note{transform:rotate(-1.5deg);display:inline-block;font-family:Caveat,"Segoe Print","Bradley Hand",cursive;font-weight:600;font-size:28px;line-height:1.1;color:var(--ink);padding:0 4px;margin:0;text-align:center}
.noteWrap{padding:0 24px;display:flex;flex-direction:column;align-items:center;gap:6px}
.onblue{margin-top:auto;padding:0 0 4px}
.full .top{border-bottom:0;flex:1}
.sheet{position:relative;isolation:isolate;margin-top:auto;display:flex;flex-direction:column;padding-top:8px}
.sheet::before{content:'';position:absolute;z-index:-1;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);background:#F6F6F1;border-top:2px solid var(--ink);border-radius:28px 28px 0 0}
.daybig{font-family:Thunder,Satoshi,sans-serif;font-weight:700;text-transform:uppercase;font-size:40px;line-height:.9}
@media (max-width:360px){h1{font-size:54px}h1.xl{font-size:64px}h2{font-size:34px}.tile{height:150px;font-size:88px}}
</style>
</head>
<body>
<div id="app"><div class="spin">Loading…</div></div>
<script>
/* ============ CONFIG: the only thing to change per test ============ */
var CONFIG = {
  // Paste the Apps Script web app URL here (ends in /exec). Leave empty to run the page in demo mode.
  scriptUrl: 'https://script.google.com/macros/s/AKfycbylFzksOQ4T0iZTxQ4tBfSpxeyExiIYoerQzaWdzSR8lC2zLDWW30plH1OMtOPri-qEMg/exec',
  contactEmail: 'hello@pawiqpets.com',
  reminderTime: '17:00'   // daily calendar reminder, local time
};
/* =================================================================== */

var TZ = 'America/Vancouver';
var COLORS = { Blue: '#5EC6FF', Green: '#4FD6A5' };
var Q = new URLSearchParams(location.search);
// Preview shortcuts use plain #names (e.g. #day-3) so they also work where query strings are dropped.
var HASHES = { picked: 'k=demo&nostart=1', notpicked: 'k=demo&picked=0', survey: 'k=demo&day=11' };
var hm = location.hash.slice(1);
if (!CONFIG.scriptUrl && hm) Q = new URLSearchParams(HASHES[hm] || (/^day-\d+$/.test(hm) ? 'k=demo&day=' + hm.slice(4) : ''));
window.addEventListener('hashchange', function () { if (!CONFIG.scriptUrl) location.reload(); });
var DEMO = !CONFIG.scriptUrl || Q.get('demo') === '1';
var app = document.getElementById('app');
var S = { k: Q.get('k') || '', reg: { flags: [] }, ans: {}, data: null, err: '' };

/* ---------- small helpers ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function poss(n) { return /s$/i.test(n) ? n + "'" : n + "'s"; }
function todayPT() { return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
function addDays(iso, n) { var d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dayDiff(a, b) { return Math.round((Date.parse(a + 'T12:00:00Z') - Date.parse(b + 'T12:00:00Z')) / 864e5); }
function niceDate(iso) { return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-CA', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC' }); }
function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
function store(key, val) { try { if (val === undefined) return JSON.parse(localStorage.getItem('pq_' + key)); localStorage.setItem('pq_' + key, JSON.stringify(val)); } catch (e) { return null; } }
function myLink() { return location.origin + location.pathname + '?k=' + encodeURIComponent(S.k); }
function logo() { return '<img class="logo" src="assets/logo.svg" alt="pawIQ">'; }
function btn(group, val, label, cls, sub) {
  var on = S.ans[group] === val;
  return '<button type="button" class="' + (cls || 'opt') + '" aria-pressed="' + on + '" data-g="' + group + '" data-v="' + esc(val) + '">' + esc(label) + (sub ? '<span class="tl">' + esc(sub) + '</span>' : '') + '</button>';
}
function errBox() { return S.err ? '<div class="err" role="alert">' + esc(S.err) + '</div>' : ''; }
function paint(html, noSwitch) {
  if (!noSwitch && S.k && S.hh && S.hh.length > 1) html += '<div class="foot" style="padding-top:0"><button class="link" data-go="picker">Back to both dogs</button></div>';
  var keep = S.keep, y = window.scrollY, bg = S.bg || '#F6F6F1';
  S.keep = false; S.bg = null;
  app.innerHTML = demoBar() + html;
  app.style.background = bg; document.body.style.background = bg; document.documentElement.style.background = bg;
  app.className = bg === '#F6F6F1' ? '' : 'full';
  if (bg !== '#F6F6F1') {
    var kids = [].slice.call(app.children).filter(function (e) { return !e.classList.contains('demo'); }), rest = kids.slice(1);
    if (rest.some(function (e) { return e.textContent.trim() || e.querySelector('button,input,a'); })) {
      var sheet = document.createElement('div'); sheet.className = 'sheet';
      rest.forEach(function (e) { sheet.appendChild(e); }); app.appendChild(sheet);
    }
  }
  var tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.setAttribute('content', bg === '#F6F6F1' ? '#5EC6FF' : bg);
  if (keep) window.scrollTo(0, y); else { window.scrollTo(0, 0); var f = app.querySelector('[autofocus]'); if (f) f.focus(); }
}
function paintFull(color, html, noSwitch) { S.bg = color; paint(html, noSwitch); }

/* ---------- hand-drawn touches ---------- */
function bowl(note1, note2) {
  return '<div class="onblue"><svg class="doodle" viewBox="0 12 340 193" role="img" aria-label="Hand-drawn dog bowl with two chews, A and B">' +
    '<g transform="translate(0 16)"><ellipse cx="170" cy="172" rx="96" ry="7" fill="#00080B" opacity=".12"/>' +
    '<g stroke="#00080B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M62 108 C64 148 102 166 170 166 C238 166 276 148 278 108 Z" fill="#F6F6F1"/>' +
    '<path d="M120 166 C122 172 218 172 220 166" fill="#F6F6F1"/>' +
    '<ellipse cx="170" cy="108" rx="108" ry="32" fill="#F6F6F1"/>' +
    '<ellipse cx="170" cy="110" rx="93" ry="24" fill="#D8D2C4"/>' +
    '<g transform="translate(138 122)"><path d="M-20 -30 V0 A20 7 0 0 0 20 0 V-30 Z" fill="#8A5A2E"/><ellipse cx="0" cy="-30" rx="20" ry="7" fill="#B07A44"/><g fill="#5E3A1B" stroke="none"><circle cx="-12" cy="-20" r="1.7"/><circle cx="12" cy="-12" r="1.7"/><circle cx="-12" cy="-4" r="1.7"/></g></g>' +
    '<g transform="translate(204 126)"><path d="M-20 -30 V0 A20 7 0 0 0 20 0 V-30 Z" fill="#8A5A2E"/><ellipse cx="0" cy="-30" rx="20" ry="7" fill="#B07A44"/><g fill="#5E3A1B" stroke="none"><circle cx="13" cy="-20" r="1.7"/><circle cx="-12" cy="-13" r="1.7"/><circle cx="12" cy="-4" r="1.7"/></g></g>' +
    '</g>' +
    '<text x="138" y="118" font-size="24" text-anchor="middle" style="fill:#F6F6F1">A</text><text x="204" y="122" font-size="24" text-anchor="middle" style="fill:#F6F6F1">B</text></g>' +
    '<g fill="none" stroke="#5EC6FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="stroke:#00080B">' +
    '<path d="M250 52 C292 50 306 76 288 100"/><path d="M282 88 L289 101 L299 91"/></g>' +
    '<g transform="rotate(-2.5 12 40)"><text x="12" y="40" font-size="30">' + esc(note1) + '</text>' + (note2 ? '<text x="12" y="68" font-size="30">' + esc(note2) + '</text>' : '') + '</g></svg></div>';
}
function handNote(t) { return '<div class="noteWrap"><p class="note">' + esc(t) + '</p></div>'; }
function arrowDown() { return '<svg width="46" height="40" viewBox="0 0 46 40" aria-hidden="true" style="display:block;margin:-2px auto 0"><g fill="none" stroke="#00080B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6 C24 8 32 16 30 30"/><path d="M21 24 L30 33 L38 22"/></g></svg>'; }
/* he/she, with a neutral fallback for entries that have no gender yet */
function pr(he, she, they) { var g = (S.data && S.data.dog.gender) || S.reg.gender; return g === 'Boy' ? he : g === 'Girl' ? she : (they || he); }

/* ---------- backend ---------- */
var demoDb = {
  get: function () {
    var day = Number(Q.get('day') || 3), isSib = S.k === 'demoSibKey000001';
    // demo: ?day=N means days 1..N-1 are already logged (Juno is 2 days behind Bubbles)
    function prog(sib) { var n = Math.max(0, sib ? day - 3 : day - 1), a = []; for (var i = 1; i <= n; i++) a.push(i); return a; }
    function startOf(sib) { return Q.get('nostart') === '1' ? '' : Q.get('future') === '1' ? addDays(todayPT(), 2) : addDays(todayPT(), -prog(sib).length); }
    var db = store('demo_' + S.k + day) || { logged: [], last: '', finalDone: false, emailDone: false };
    var base = prog(isSib), logged = base.slice(), yest = addDays(todayPT(), -1);
    db.logged.forEach(function (x) { if (logged.indexOf(x) < 0) logged.push(x); });
    var picked = Q.get('picked') !== '0', other = prog(!isSib);
    return { ok: true, dog: { name: isSib ? 'Juno' : 'Bubbles', owner: 'Sam', gender: Q.get('g') === 'boy' ? 'Boy' : 'Girl', picked: picked, start: startOf(isSib), lastDate: db.last || (base.length ? yest : ''), finalDone: db.finalDone, emailDone: db.emailDone },
      test: { daysPerRound: 5, r1Sticker: 'Blue', r1Formula: 'Skin & Immune', r2Sticker: 'Green', r2Formula: 'Gut Health', rogerPhone: '6045550101', edPhone: '6045550102' },
      logged: logged, siblings: Q.get('sib') === '1' ? [{ key: isSib ? 'demoKey123456789' : 'demoSibKey000001', name: isSib ? 'Bubbles' : 'Juno', picked: true, start: startOf(!isSib), finalDone: false, logged: other, lastDate: other.length ? yest : '' }] : [] };
  },
  post: function (p) {
    var day = Number(Q.get('day') || 3), db = store('demo_' + S.k + day) || { logged: [], finalDone: false, emailDone: false };
    if (p.action === 'log') { if (db.logged.indexOf(p.day) < 0) db.logged.push(p.day); db.last = todayPT(); }
    if (p.action === 'final') db.finalDone = true;
    if (p.action === 'email') db.emailDone = !!p.consent;
    if (p.action === 'register') { var fl = String(p.flags || ''); return { ok: true, key: 'demoNew' + Math.random().toString(36).slice(2, 12), status: /chicken/.test(fl) ? 'Excluded' : (fl.replace(/Nope, none of these|Sensitive stomach/g, '').replace(/[; ]/g, '') ? 'Needs review' : 'OK') }; }
    store('demo_' + S.k + day, db);
    return { ok: true, row: 2 };
  }
};
function apiGet() {
  if (DEMO) return Promise.resolve(demoDb.get());
  return fetch(CONFIG.scriptUrl + '?k=' + encodeURIComponent(S.k)).then(function (r) { return r.json(); });
}
function apiPost(p) {
  if (DEMO) return new Promise(function (res) { setTimeout(function () { res(demoDb.post(p)); }, 350); });
  return fetch(CONFIG.scriptUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) })
    .then(function (r) { return r.json(); });
}
function save(p, btnEl, then) {
  S.err = '';
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'Saving…'; }
  apiPost(p).then(function (r) {
    if (!r || !r.ok) throw new Error(r && r.error);
    then(r);
  }).catch(function () {
    S.err = "That didn't save. Check your signal and tap again. Your answers are still here.";
    S.keep = true; route();
  });
}

/* ---------- demo bar (only when no backend URL is set) ---------- */
function demoBar() {
  if (!DEMO) return '';
  function l(h, t) { return '<a href="#' + h + '">' + t + '</a>'; }
  return '<div class="demo"><span>Preview, nothing is saved:</span>' + l('signup', 'Sign-up') + l('picked', 'Picked') +
    l('day-1', 'Day 1') + l('day-2', 'Day 2') + l('day-3', 'Day 3') + l('day-4', 'Day 4') + l('day-5', 'Day 5') + l('day-6', 'Day 6') + l('day-7', 'Day 7') +
    l('survey', 'Survey') + l('notpicked', 'Not picked') + '</div>';
}

/* ======================= SIGN-UP FLOW (no key) ======================= */
function welcome() {
  paint(
    '<section class="top" style="background:var(--blue);padding-bottom:40px;gap:18px">' + logo() +
    '<p class="eyebrow" style="margin-top:24px">The pawIQ taste test</p>' +
    '<h1 class="xl">Thank you. Seriously.</h1>' +
    '<p class="lead">You and your dog are helping us pick our final recipe. Your dog does the hard part: eating.</p>' +
    '<button class="cta" data-go="join">Sign up your dog</button>' +
    '<div style="display:flex;flex-direction:column;align-items:center;margin-top:-6px"><svg width="46" height="40" viewBox="0 0 46 40" aria-hidden="true" style="display:block;transform:scaleY(-1);margin-bottom:-4px"><g fill="none" stroke="#00080B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6 C24 8 32 16 30 30"/><path d="M21 24 L30 33 L38 22"/></g></svg><p class="sh">start here. takes 2 minutes.</p></div></section>' +
    '<section class="sec" style="padding-top:36px;gap:20px"><p class="eyebrow">How it works</p>' +
    '<div class="step"><span class="n">1</span><p style="font-size:17px"><strong>Sign up your dog.</strong> If we get more dogs than chews, we\'ll pick a mix of sizes and ages.</p></div>' +
    '<div class="step"><span class="n">2</span><p style="font-size:17px"><strong>We drop off a kit.</strong> Two bags of chews, labelled A and B, with simple instructions inside.</p></div>' +
    '<div class="step"><span class="n">3</span><p style="font-size:17px"><strong>10 days, 1 minute a day.</strong> Put both down, tap which one your dog ate first.</p></div>' +
    '<div class="grid2" style="margin-top:6px">' +
    '<div class="card" style="background:var(--blue)"><span class="eyebrow" style="font-size:11px">Days 1 to 5<br>Blue sticker</span><span class="display" style="font-size:30px">Skin &amp; Immune</span></div>' +
    '<div class="card" style="background:var(--green)"><span class="eyebrow" style="font-size:11px">Days 6 to 10<br>Green sticker</span><span class="display" style="font-size:30px">Gut Health</span></div></div></section>' +
    '<div class="foot" style="flex-direction:row;flex-wrap:wrap;gap:6px;font-size:14px"><span>Questions?</span><a href="mailto:' + CONFIG.contactEmail + '"><strong>' + CONFIG.contactEmail + '</strong></a><span>·</span><a href="#" data-go="ingredients"><strong>What\'s in the chews</strong></a></div>'
  );
}

function formTop(n, title) {
  return '<div class="sec" style="padding-top:16px"><div class="bar"><button class="back" data-go="' + (n === 1 ? 'welcome' : ['', 'join', 'about', 'checks'][n - 1]) + '">← Back</button><span style="font-size:13px;font-weight:700">' + n + ' of 4</span></div>' +
    '<h1 style="margin-top:12px">' + title + '</h1>' + errBox() + '</div>';
}
function join() {
  S.ans.gender = S.reg.gender;

/* ======================= DAILY FLOW (?k=) ======================= */
function setData(r) {
  S.data = r;
  var me = { key: S.k, name: r.dog.name, picked: r.dog.picked, start: r.dog.start, finalDone: r.dog.finalDone, logged: r.logged, lastDate: r.dog.lastDate || '' };
  S.hh = [me].concat(r.siblings || []);
}
function dogState(d) {
  var T0 = S.data.test, tot = T0.daysPerRound * 2;
  if (!d.picked) return 'Waiting for a kit';
  if (!d.start) return 'Start date coming';
  if (dayDiff(todayPT(), d.start) < 0) return 'Starts ' + niceDate(d.start);
  var n = d.logged.length ? Math.max.apply(null, d.logged) : 0, done = d.lastDate === todayPT();
  if (n >= tot && !done) return d.finalDone ? 'All done' : 'Final questions to answer';
  return done ? 'Day ' + n + ' logged' : 'Day ' + (n + 1) + ' to log';
}
function picker() {
  S.err = ''; S.ans = {};
  var due = S.hh.filter(function (d) { return /to log$/.test(dogState(d)); }).length, doneToday = S.hh.filter(function (d) { return /logged$/.test(dogState(d)); }).length;
  var pk = due === 0 ? ['You\'re done!', 'See you tomorrow!'] : doneToday > 0 ? ['Who\'s next?', 'One more to log today.'] : ['Who\'s up first?', 'Log both dogs today. Order doesn\'t matter.'];
  paintFull('#5EC6FF', '<section class="top" style="background:var(--blue);gap:14px"><div class="bar">' + logo() + '</div><h1 class="xl" style="margin-top:12px">' + pk[0] + '</h1><p class="lead">' + pk[1] + '</p></section>' +
    '<div class="sec"><div class="stack">' + S.hh.map(function (d) {
      return '<button type="button" class="opt left" style="padding:14px 18px" data-pick="' + esc(d.key) + '"><span class="display" style="font-size:30px;display:block;line-height:1.05">' + esc(d.name) + '</span><span style="font-size:14px;font-weight:500">' + esc(dogState(d)) + '</span></button>';
    }).join('') + '</div></div>', true);
}
function T() { return S.data.test; }
function dog() { return esc(S.data.dog.name); }
function owner() { return esc(S.data.dog.owner || 'there'); }
function total() { return T().daysPerRound * 2; }
function roundOf(day) { var r1 = day <= T().daysPerRound; return { sticker: r1 ? T().r1Sticker : T().r2Sticker, formula: r1 ? T().r1Formula : T().r2Formula }; }
/* Days count what was actually logged, not the calendar: Day N is the Nth day the dog gets chews.
   A skipped day just moves everything back one, so every dog still gets all 5 days of each flavour. */
function lastLogged() { var L = S.data.logged; return L.length ? Math.max.apply(null, L) : 0; }
function doneToday() { return S.data.dog.lastDate === todayPT(); }
function currentDay() { var s = S.data.dog.start; if (!s || dayDiff(todayPT(), s) < 0) return 0; return doneToday() ? lastLogged() : lastLogged() + 1; }
function isLogged(day) { return S.data.logged.indexOf(day) >= 0; }
function aLeft(day) { return (day + hash(S.k)) % 2 === 0; }

function home() {
  S.err = ''; S.ans = {};
  var d = S.data.dog, day = currentDay();
  if (!d.picked) return notPicked();
  if (!d.start || day < 1) return credential();
  if (day <= total()) {
    if (doneToday()) return logged(day);
    if (day === T().daysPerRound + 1 && !store('switch_' + S.k)) return switchScreen();
    return dailyLog(day, false);
  }
  if (!d.finalDone) return survey();
  return thankYou();
}

function dots(day) {

  function sms(n, ph) { return ph ? '<a class="cta" href="' + esc('sms:' + ph) + '">Text ' + n + '</a>' : '<span class="cta" style="opacity:.3" aria-disabled="true">Text ' + n + '</span>'; }
  paintFull('#5EC6FF', '<section class="top" style="background:var(--blue);gap:14px">' + logo() + '<h1 class="xl" style="margin-top:28px">Pause the chews for now.</h1>' +
    '<p class="lead">Thanks for telling us. Please pause the chews for ' + dog() + ' until we message you. Tap to text us now.</p></section>' +
    '<div class="sec"><div class="grid2">' + sms('Roger', t.rogerPhone) + sms('Ed', t.edPhone) + '</div>' +
    '<p style="font-weight:700">Worried? Call your vet.</p></div>' +
    '<div class="foot"><button class="cta ghost" data-fixprev="' + day + '">Change my answer</button><button class="cta" data-logged="' + day + '">Got it</button></div>');
}
function nextDogBtn() {
  if (!S.hh || S.hh.length < 2) return '';
  var o = S.hh.filter(function (d) { return d.key !== S.k && /to log$/.test(dogState(d)); })[0];
  return o ? '<button class="cta" data-go="picker">Now log ' + esc(o.name) + '</button>' : '';
}
function logged(day) {
  var last = day === total(), nm = S.data.dog.name;
  var LINES = [['good one, ' + nm + '.', 'see you tomorrow.'], ['noted.', nm + ' is thorough.'], ['another day,', 'another data point.'], [nm + ', the official', 'taste tester.'], ['that\'s day ' + day + '.', nm + ' is on a roll.'], ['we\'re taking notes.', nm + ' is, too.'], ['good dog.', 'good data.']];
  var L = last ? ['that\'s all 10 chews.', 'thank you, truly.'] : LINES[(day - 1) % LINES.length];
  paintFull(COLORS[roundOf(day).sticker] || '#5EC6FF', '<section class="top" style="background:' + (COLORS[roundOf(day).sticker] || 'var(--blue)') + ';min-height:52vh;gap:6px"><div class="bar">' + logo() + '</div>' +
    (S.hh && S.hh.length > 1 ? '<span class="dogchip">' + dog() + '</span>' : '') + bowl(L[0], L[1]) + '<h1 class="xl" style="margin-top:0">Day ' + day + ', done.</h1>' +
    '<p class="lead">' + (last ? 'That\'s all 10 chews, ' + dog() + '. Last questions open tomorrow.' : 'Thanks, ' + dog() + '. Same time tomorrow.') + '</p></section>' +
    '<div class="foot">' + nextDogBtn() + lateLink(currentDay()) + '<button class="link" data-fix="' + day + '">Oops, fix today\'s answer</button></div>');
}

function survey() {
  var t = T(), a = S.ans;
  function q(g) { return '<div class="grid3">' + btn(g, 'A', 'A') + btn(g, 'B', 'B') + btn(g, "Couldn't tell", 'No difference') + '</div>'; }
  function buy(g, formula) { var w = g === 'buy' ? 'why' : 'why2', v = a[g], why = (v === 'Maybe' || v === 'No') ? '<label class="f" for="' + w + '">What would make it a yes? Or what put you off?<textarea id="' + w + '" maxlength="500">' + esc(a[w] || '') + '</textarea></label>' : ''; return '<h3 style="margin-top:8px">Would you buy ' + esc(formula) + ' chews for ' + dog() + '?</h3><div class="grid3">' + btn(g, 'Yes', 'Yes') + btn(g, 'Maybe', 'Maybe') + btn(g, 'No', 'No') + '</div>' + why; }
  var yes = a.problems === 'Yes';
  paint('<section class="top" style="background:var(--blue)">' + logo() + '<h1 style="margin-top:22px">Last bit, we promise.</h1><p class="lead">A few quick ones about the whole test.</p></section>' +
    '<div class="sec"><div class="card" style="background:' + (COLORS[t.r1Sticker] || '#fff') + '"><span class="eyebrow" style="font-size:11px">' + esc(t.r1Sticker) + ' sticker<br>' + esc(t.r1Formula) + '</span><h3>Overall, which did ' + dog() + ' seem to like more?</h3></div>' + q('yellow') + buy('buy', t.r1Formula) + '</div>' +
    '<div class="sec"><div class="card" style="background:' + (COLORS[t.r2Sticker] || '#fff') + '"><span class="eyebrow" style="font-size:11px">' + esc(t.r2Sticker) + ' sticker<br>' + esc(t.r2Formula) + '</span><h3>Overall, which did ' + dog() + ' seem to like more?</h3></div>' + q('green') + buy('buy2', t.r2Formula) + '</div>' +
    '<div class="sec"><h3>Any problems at all with ' + dog() + ' during the test?</h3><div class="grid2">' + btn('problems', 'No', 'No') + btn('problems', 'Yes', 'Yes, I\'ll say below') + '</div></div>' +
    '<div class="sec"><label class="f" for="fnotes">' + (yes ? 'What happened? (required)' : 'Anything else? (optional)') + '</label><textarea id="fnotes" maxlength="1000"' + (yes ? ' placeholder="Tell us what happened so we can help"' : '') + '>' + esc(a.fnotes || '') + '</textarea></div>' +
    '<div class="foot">' + errBox() + '<button class="cta" id="submitFinal">Send</button>' + lateLink(currentDay()) + '</div>');
}

function thankYou() {
  var done = S.data.dog.emailDone || store('emailSkip_' + S.k);
  paintFull('#5EC6FF', '<section class="top" style="background:var(--blue);gap:14px">' + logo() + '<h1 class="xl" style="margin-top:28px">Thank you, ' + dog() + '.</h1>' +
    '<p class="lead">' + total() + ' chews done. We couldn\'t have done this without you both. Once every dog finishes, we\'ll tell you which recipe won.</p></section>' +
    (done ? '<div class="foot"></div>' :
      '<div class="sec"><h2>Want launch news?</h2>' +
      '<label class="f">Email<input type="email" id="email" autocomplete="email" maxlength="120"></label>' +
      '<label class="tick"><input type="checkbox" id="consent">Yes, pawIQ can email me. Unsubscribe anytime.</label>' + errBox() + '</div>' +
      '<div class="foot"><button class="cta" id="submitEmail">Keep me posted</button><button class="link" id="skipEmail">No thanks</button></div>'));
}

/* ---------- calendar reminders (.ics) ---------- */
function remindOptions() {
  var o = '';
  for (var h = 6; h <= 21; h++) { var h12 = h % 12 === 0 ? 12 : h % 12; o += '<option value="' + (h < 10 ? '0' : '') + h + '00">' + h12 + ':00 ' + (h < 12 ? 'AM' : 'PM') + '</option>'; }
  return o;
}
function downloadIcs() {
  var sel = document.getElementById('remindTime');
  if (!sel || !sel.value) { S.err = 'Pick a time first.'; return credential(); }
  var d = S.data.dog, t = sel.value + '00', start = d.start.replace(/-/g, '');
  var stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//pawIQ//Taste Test//EN', 'BEGIN:VEVENT',
    'UID:' + S.k + '@pawiqpets.com', 'DTSTAMP:' + stamp, 'DTSTART:' + start + 'T' + t, 'DURATION:PT10M',
    'RRULE:FREQ=DAILY;COUNT=' + (total() + 4), 'SUMMARY:' + S.data.dog.name + "'s taste test (1 min)",
    'DESCRIPTION:Put A and B down\\, then tap which went first: ' + myLink(), 'URL:' + myLink(),
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Taste test time', 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
  a.download = 'pawIQ-taste-test.ics'; document.body.appendChild(a); a.click(); a.remove();
}

/* ======================= EVENTS ======================= */
function grabReg() {
  ['dog', 'breed', 'age', 'weight', 'owner', 'phone'].forEach(function (id) { var el = document.getElementById(id); if (el) S.reg[id] = el.value.trim(); });
  var sp = document.getElementById('supps'); if (sp) S.reg.supplements = sp.value.trim();
  var ot = document.getElementById('other'); if (ot) S.reg.other = ot.value.trim();
  var ag = document.getElementById('agree'); if (ag) S.reg.agree = ag.checked;
  if (S.ans.fussy) S.reg.fussy = S.ans.fussy;
}
var REG = { welcome: welcome, join: join, about: about, checks: checks, you: you };
function validate(step) {
  var r = S.reg;
  if (step === 'about' && !r.dog) return "What's your dog's name?";
  if (step === 'about' && !r.gender) return 'Boy, girl or not sure? Tap one.';
  if (step === 'checks' && (!r.age || !r.weight || !r.fussy)) return 'Age, weight and fussiness help us pick a good mix.';
  if (step === 'checks' && (Number(r.weight) < 1 || Number(r.weight) > 250)) return 'Weight looks off. In pounds, please.';
  if (step === 'you' && !r.flags.length) return 'Tick any that fit, or "Nope, none of these".';
  if (step === 'you' && !r.usualtime) return 'Pick a usual time of day for the chews.';
  if (step === 'you' && r.hh && !r.sidebyside) return 'Are the two dogs fed side by side? Tap one.';
  return '';
}

app.addEventListener('click', function (e) {
  var el = e.target.closest('button, a, input[data-flag]');
  if (!el) return;
  S.keep = false;
  if (el.dataset.flag) { // checkboxes on the checks screen
    var f = S.reg.flags, v = el.dataset.flag, none = 'Nope, none of these';
    if (el.checked && v === 'Allergic to chicken') { el.checked = false; return chickenModal(); }
    if (el.checked) { if (v === none) f.length = 0; else { var i = f.indexOf(none); if (i >= 0) f.splice(i, 1); } f.push(v); }
    else f.splice(f.indexOf(v), 1);
    app.querySelectorAll('input[data-flag]').forEach(function (c) { c.checked = f.indexOf(c.dataset.flag) >= 0; });
    return;
  }
  if (el.dataset.hv) { // how's the dog today: tap all that apply
    var nt = document.getElementById('notes'); if (nt) S.ans.notes = nt.value;
    var L = (S.ans.healthList || []).slice(), v = el.dataset.hv, i = L.indexOf(v);
    if (v === 'All good') L = i >= 0 ? [] : ['All good'];
    else { var g = L.indexOf('All good'); if (g >= 0) L.splice(g, 1); i = L.indexOf(v); if (i >= 0) L.splice(i, 1); else L.push(v); }
    S.ans.healthList = L; S.ans.health = L.join('; '); S.err = ''; S.keep = true;
    return dailyLog(S.logDay, S.late);
  }
  if (el.dataset.g) { // single-choice buttons
    var notes = document.getElementById('notes'); if (notes) S.ans.notes = notes.value;
    var fn = document.getElementById('fnotes'); if (fn) S.ans.fnotes = fn.value;
    ['why', 'why2'].forEach(function (id) { var el2 = document.getElementById(id); if (el2) S.ans[id] = el2.value; });
    grabReg(); S.err = ''; S.keep = true;
    S.ans[el.dataset.g] = el.dataset.v;
    if (el.dataset.g === 'fussy') S.reg.fussy = el.dataset.v;
    if (el.dataset.g === 'gender') S.reg.gender = el.dataset.v;
    if (el.dataset.g === 'usualtime') S.reg.usualtime = el.dataset.v;
    if (el.dataset.g === 'sidebyside') S.reg.sidebyside = el.dataset.v;
    if (S.data && S.logDay && !S.data.dog.finalDone && document.getElementById('submitLog')) return dailyLog(S.logDay, S.late);
    return route(true);
  }
  if (el.dataset.pick) {
    S.k = el.dataset.pick; S.picked = true; S.logDay = null; S.late = false;
    paint('<div class="spin">One sec…</div>', true);
    return apiGet().then(function (r) { if (!r || !r.ok) throw 0; setData(r); home(); }).catch(function () { paint('<div class="spin">Can\'t reach the taste test right now. Check your signal and refresh.</div>', true); });
  }
  if (el.dataset.go) {
    e.preventDefault(); S.err = ''; grabReg();
    var g = el.dataset.go;
    if (g === 'again') { S.reg = { flags: [], owner: S.reg.owner, phone: S.reg.phone, hh: S.hhKey || '' }; S.ans = {}; S.view = 'join'; return join(); }
    if (g === 'picker') return picker();
    if (g === 'home') return home();
    if (g === 'ingredients') { S.view = 'ingredients'; return ingredients(); }
    S.view = g; return REG[g]();
  }
  if (el.dataset.next) {
    grabReg();
    if (el.dataset.next === 'you' && S.reg.flags.indexOf('Allergic to chicken') >= 0) return chickenStop(el);
    S.err = validate(el.dataset.next);
    if (S.err) return REG[S.view]();
    S.view = el.dataset.next; return REG[S.view]();
  }
  if (el.dataset.late) { S.ans = {}; S.err = ''; return dailyLog(Number(el.dataset.late), true); }
  if (el.dataset.fix) { S.ans = {}; S.err = ''; return dailyLog(Number(el.dataset.fix), false); }
  if (el.dataset.fixprev) { S.ans = JSON.parse(JSON.stringify(S.lastAns || {})); S.err = ''; return dailyLog(Number(el.dataset.fixprev), false); }
  if (el.dataset.logged) return logged(Number(el.dataset.logged));
  if (el.id === 'gotSwitch') { store('switch_' + S.k, true); return dailyLog(currentDay(), false); }
  if (el.id === 'copy') { (navigator.clipboard ? navigator.clipboard.writeText(myLink()) : Promise.reject()).then(function () { el.textContent = 'Copied'; }, function () { prompt('Copy this link', myLink()); }); return; }
  if (el.id === 'ics') return downloadIcs();

  if (el.id === 'submitReg') {
    grabReg();
    if (!S.reg.owner || !S.reg.phone) { S.err = 'Your name and phone, please, so we can arrange drop-off.'; return you(); }
    if (!S.reg.agree) { S.err = 'Tick the box to say you got it.'; return you(); }
    var r = S.reg;
    return save({ action: 'register', dog: r.dog, breed: r.breed, age: r.age, weight: r.weight, fussy: r.fussy, flags: r.flags.join('; '), supplements: r.supplements, gender: r.gender, other: r.other, owner: r.owner, phone: r.phone, hh: r.hh || '', usualtime: r.usualtime, sidebyside: r.sidebyside || '' }, el, function (res) { S.reviewNote = res.status === 'Needs review'; if (!S.hhKey && res.key) S.hhKey = res.key; S.regCount = (S.regCount || 0) + 1; S.view = 'registered'; registered(); });
  }
  if (el.id === 'submitLog') {
    var a = S.ans; a.notes = document.getElementById('notes').value;
    var neither = a.first === 'Neither';
    if (!a.first || (!neither && (!a.finished || !a.eaten)) || !a.health) { S.err = 'Answer the 4 questions first. Notes are optional.'; S.keep = true; return dailyLog(S.logDay, S.late); }
    var hl = a.healthList || [], mild = !(hl.indexOf('Threw up') >= 0 || hl.indexOf('Something else') >= 0) && (hl.indexOf('Loose poop') >= 0 || hl.indexOf('Extra itchy') >= 0);
    if (mild && !a.normal) { S.err = 'Is that normal for ' + S.data.dog.name + '? Tap yes or no.'; S.keep = true; return dailyLog(S.logDay, S.late); }
    var healthOut = a.health + (mild ? (a.normal === 'Yes' ? ' (normal for dog)' : ' (not normal)') : '');
    var day = S.logDay, rd = roundOf(day);
    return save({ action: 'log', k: S.k, day: day, sticker: rd.sticker, side: aLeft(day) ? 'Left' : 'Right', first: a.first,
      finished: neither ? 'n/a' : a.finished, eaten: neither ? 'n/a' : a.eaten, health: healthOut, notes: a.notes, late: S.late }, el, function () {
      if (!isLogged(day)) S.data.logged.push(day);
      S.data.dog.lastDate = todayPT(); S.hh.forEach(function (x) { if (x.key === S.k) x.lastDate = todayPT(); });
      var sick = !(a.health === 'All good' || (mild && a.normal === 'Yes')); S.lastAns = JSON.parse(JSON.stringify(a)); S.ans = {};
      if (sick) return stopScreen(day);
      if (S.late && day < currentDay() && currentDay() <= total()) return home();
      return logged(day);
    });
  }
  if (el.id === 'submitFinal') {
    var s = S.ans; s.fnotes = document.getElementById('fnotes').value;
    ['why', 'why2'].forEach(function (id) { var el2 = document.getElementById(id); if (el2) s[id] = el2.value; });
    if (!s.yellow || !s.green || !s.buy || !s.buy2 || !s.problems) { S.err = 'Please answer every question above.'; S.keep = true; return survey(); }
    if (s.problems === 'Yes' && !s.fnotes.trim()) { S.err = 'Please tell us what happened in the box, so we can help.'; S.keep = true; return survey(); }
    return save({ action: 'final', k: S.k, yellow: s.yellow, green: s.green, buy: s.buy, buy2: s.buy2, why: (s.buy === 'Yes' ? '' : s.why || ''), why2: (s.buy2 === 'Yes' ? '' : s.why2 || ''), problems: s.problems, notes: s.fnotes }, el, function () { S.data.dog.finalDone = true; S.ans = {}; thankYou(); });
  }
  if (el.id === 'submitEmail') {
    var em = document.getElementById('email').value.trim(), ok = document.getElementById('consent').checked;
    if (!ok) { S.err = 'Tick the box if you want the emails. Or tap No thanks.'; S.keep = true; return thankYou(); }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { S.err = 'That email looks off.'; S.keep = true; return thankYou(); }
    return save({ action: 'email', k: S.k, email: em, consent: true }, el, function () { S.data.dog.emailDone = true; S.err = ''; thankYou(); });
  }
  if (el.id === 'skipEmail') { store('emailSkip_' + S.k, true); return thankYou(); }
});

function route(keep) {
  if (!S.k) { if (S.view === 'registered') return registered(); if (S.view === 'ingredients') return ingredients(); return (REG[S.view] || welcome)(); }
  if (!S.data) return;
  if (S.logDay && document.getElementById('submitLog')) return dailyLog(S.logDay, S.late);
  if (document.getElementById('submitFinal')) return survey();
  if (document.getElementById('submitEmail')) return thankYou();
  return home();
}

/* ---------- start ---------- */
if (!S.k) { S.view = 'welcome'; welcome(); }
else apiGet().then(function (r) {
  if (!r || !r.ok) { paintFull('#5EC6FF', '<section class="top" style="background:var(--blue);min-height:60vh;justify-content:flex-end;gap:14px">' + logo() + '<h1 style="margin-top:auto">Hmm, that link didn\'t work.</h1><p class="lead">Message Roger or Ed and we\'ll send it again.</p></section>'); return; }
  setData(r);
  var ready = S.hh.filter(function (d) { return d.picked; });
  if (S.hh.length > 1 && ready.length > 1) return picker();
  home();
}).catch(function () { paint('<div class="spin">Can\'t reach the taste test right now. Check your signal and refresh.</div>'); });
</script>
</body>
</html>

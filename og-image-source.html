<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #5EC6FF;
  }
  .canvas {
    width: 1200px;
    height: 630px;
    background: #5EC6FF;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .canvas::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(255,255,255,0.22) 0%, transparent 70%);
  }
  .paw-br {
    position: absolute;
    bottom: -40px;
    right: -20px;
    font-size: 320px;
    opacity: 0.08;
    line-height: 1;
    user-select: none;
  }
  .paw-tl {
    position: absolute;
    top: -60px;
    left: -30px;
    font-size: 220px;
    opacity: 0.08;
    line-height: 1;
    user-select: none;
    transform: rotate(-20deg);
  }
  .logo-wrap {
    position: relative;
    z-index: 2;
  }
  .logo-wrap img {
    width: 500px;
    height: auto;
    display: block;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="paw-tl">🐾</div>
    <div class="paw-br">🐾</div>
    <div class="logo-wrap">
      <img src="./assets/logo-white.png" alt="pawIQ" />
    </div>
  </div>
</body>
</html>

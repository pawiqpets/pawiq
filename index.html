<script>
  // Populate user agent field
  const ua = document.getElementById("uaField");
  if (ua) ua.value = navigator.userAgent;

  // Show "Thank You." after the form posts (iframe load)
  const form = document.getElementById("signupForm");
  const iframe = document.getElementById("hidden_iframe");
  const success = document.getElementById("successMsg");
  const signupBlock = document.getElementById("signupBlock");
  const postQWrap = document.getElementById("postQuestion");
  const postQPrompt = document.getElementById("postQPrompt");
  const postQPromptId = document.getElementById("postQPromptId");
  const postQForm = document.getElementById("postQForm");
  const postQAnswer = document.getElementById("postQAnswer");
  const postQThanks = document.getElementById("postQThanks");

  let lastEmail = "";

  if (form && iframe && success) {
    let submitted = false;
  form.addEventListener("submit", () => {
  submitted = true;


  const emailField = form.querySelector('input[name="email"]');
  lastEmail = emailField ? emailField.value.trim() : "";
});

iframe.addEventListener("load", () => {
  if (!submitted) return;

  // Fade out signup section
  if (signupBlock) {
    signupBlock.classList.add("is-hidden");
    window.setTimeout(() => {
      signupBlock.classList.add("is-gone");
    }, 240);
  }

  const prompts = [
    { id: "q1", text: "What makes staying consistent with supplements hard?" },
    { id: "q2", text: "What frustrates you most about dog supplements?" },
    { id: "q3", text: "Why did you start using supplements in the first place?" }
  ];

  const pick = prompts[Math.floor(Math.random() * prompts.length)];

  if (postQPrompt && postQPromptId && postQWrap) {
    postQPrompt.textContent = pick.text;
    postQPromptId.value = pick.id;

    // Prepare question block for fade in
    postQWrap.classList.remove("is-gone");
    postQWrap.classList.remove("hidden");

    window.setTimeout(() => {
      postQWrap.classList.remove("is-hidden");
    }, 20);
  }

  form.reset();
  submitted = false;
});
    
  }

   if (postQForm && postQAnswer) {
  postQForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const answer = (postQAnswer.value || "").trim();
    if (!answer) return;

    const payload = new URLSearchParams();
    payload.set("email", lastEmail);
    payload.set("consent", "yes");
    payload.set("page", "https://www.pawiqpets.com/");
    payload.set("user_agent", navigator.userAgent);
    payload.set("feedback", answer);
    payload.set("prompt_id", postQPromptId ? postQPromptId.value : "");

    try {
      await fetch(form.action, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
        body: payload.toString()
      });

     if (postQThanks) postQThanks.style.display = "block";

window.setTimeout(() => {
  if (postQWrap) {
    postQWrap.classList.add("is-hidden");

    window.setTimeout(() => {
      postQWrap.classList.add("is-gone");

      // Reset UI for future interactions
      postQAnswer.disabled = false;
      postQAnswer.value = "";
      postQForm.querySelector("button").style.display = "";
      if (postQThanks) postQThanks.style.display = "none";
    }, 240);
  }
}, 450);
     
      
    } catch (err) {}
  });
}
  
  /* Background video: play -> wait 10s -> restart gently */
(function () {
  const video = document.getElementById("bgVideo");
  if (!video) return;

  const WAIT_MS = 10000;
  const IS_MOBILE = window.matchMedia("(max-width: 768px)").matches;

  let timer = null;

  function restartGently() {
  try {
    // start soft fade/blur
    video.classList.add("soft-restart");

    window.setTimeout(() => {
      video.pause();
      video.currentTime = 0;

      const p = video.play();
      if (p && typeof p.catch === "function") p.catch(() => {});

      // remove effect after restart settles
      window.setTimeout(() => {
        video.classList.remove("soft-restart");
      }, 180);
    }, 80);
  } catch (e) {
    video.classList.remove("soft-restart");
  }
}

  function scheduleRestart() {
    if (timer) window.clearTimeout(timer);
    timer = window.setTimeout(restartGently, WAIT_MS);
  }

  // Desktop behavior: when video ends, wait 10s, then restart gently
  // Mobile behavior: play once only, never restart
  video.addEventListener("ended", () => {
    if (IS_MOBILE) return;
    scheduleRestart();
  });

  // If user switches tabs, do NOT auto-replay on mobile.
  // On desktop, only resume the delayed restart if the video already ended.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (timer) window.clearTimeout(timer);
      timer = null;
      return;
    }

    if (IS_MOBILE) return;

    if (video.ended) scheduleRestart();
  });
  
})();
  
</script>
